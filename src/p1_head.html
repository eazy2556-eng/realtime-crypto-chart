<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>실시간 코인 차트</title>
<meta name="theme-color" content="#131722">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="실시간 차트">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23131722'/%3E%3Cpath d='M10 6v20M22 4v22' stroke='%23d1d4dc' stroke-width='2'/%3E%3Crect x='7' y='11' width='6' height='10' rx='1' fill='%23089981'/%3E%3Crect x='19' y='8' width='6' height='12' rx='1' fill='%23f23645'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* 레이아웃: 트레이딩뷰식 3단 — 위 툴바 / 왼쪽 그리기 도구 / 가운데 차트(+보조 지표 창) / 오른쪽 시세 패널 */
:root{
  --bg:#131722; --raise:#1e222d; --raise-2:#2a2e39; --line:#2a2e39; --grid:#1c2030;
  --fg:#d1d4dc; --muted:#787b86;
  --accent:#2962ff; --accent-soft:rgba(41,98,255,.18);
  --up:#089981; --down:#f23645; --up-soft:rgba(8,153,129,.16); --down-soft:rgba(242,54,69,.16);
  --up-vol:rgba(8,153,129,.45); --down-vol:rgba(242,54,69,.45);
  --warn:#f7a600; --star:#f0b90b; --cross:#758696; --cross-label:#363a45; --watermark:rgba(209,212,220,.06);
  --shadow:0 10px 30px rgba(0,0,0,.45); --backdrop:rgba(0,0,0,.5);
  --ui:"IBM Plex Sans KR",-apple-system,"Segoe UI","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#ffffff; --raise:#f0f3fa; --raise-2:#e0e3eb; --line:#e0e3eb; --grid:#f2f4f9;
  --fg:#131722; --muted:#6a6d78;
  --accent-soft:rgba(41,98,255,.12);
  --up-soft:rgba(8,153,129,.12); --down-soft:rgba(242,54,69,.12);
  --up-vol:rgba(8,153,129,.4); --down-vol:rgba(242,54,69,.4);
  --cross:#9598a1; --cross-label:#131722; --watermark:rgba(19,23,34,.05);
  --shadow:0 10px 30px rgba(19,23,34,.15); --backdrop:rgba(19,23,34,.35);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.45 var(--ui);-webkit-font-smoothing:antialiased;overflow:hidden}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:4px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .muted{color:var(--muted)}
.app{padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
@media (hover:none){.w-del{opacity:.75}}
.app{height:100%;display:grid;grid-template-columns:48px minmax(0,1fr) 316px;grid-template-rows:48px minmax(0,1fr);grid-template-areas:"top top top" "tools chart side"}

/* 위 툴바 */
.topbar{grid-area:top;display:flex;align-items:center;gap:2px;padding:0 8px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;min-width:0}
.topbar::-webkit-scrollbar{display:none}
.vsep{width:1px;height:22px;background:var(--line);margin:0 6px;flex:none}
.grow{flex:1 1 auto}
.sym-btn{display:flex;align-items:center;gap:8px;height:34px;padding:0 8px 0 6px;border-radius:6px;font-weight:600;font-size:14px;flex:none;white-space:nowrap}
.sym-btn svg,.iv-drop svg{color:var(--muted)}
.sym-btn:hover,.tb-btn:hover,.iv:hover,.icon-btn:hover,.tool:hover,.iv-drop:hover{background:var(--raise)}
.coin{width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:600;color:#fff;background:hsl(var(--h,220) 58% 46%);flex:none;line-height:1}
.coin.lg{width:34px;height:34px;font-size:15px}
.ivs{display:flex;gap:1px;flex:none}
.iv{height:30px;min-width:36px;padding:0 8px;border-radius:6px;white-space:nowrap}
.iv[aria-pressed="true"]{color:var(--accent);background:var(--accent-soft);font-weight:600}
.iv-drop{display:flex;align-items:center;gap:4px;height:30px;padding:0 6px;border-radius:6px;flex:none;white-space:nowrap}
.iv-drop.on{color:var(--accent);background:var(--accent-soft);font-weight:600}
.iv-drop[aria-expanded="true"]{background:var(--raise)}
.tb-btn{display:flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:6px;white-space:nowrap;flex:none}
.tb-btn[aria-expanded="true"]{background:var(--raise)}
.tb-btn svg,.tool svg,.icon-btn svg{width:18px;height:18px;flex:none}
.icon-btn{width:32px;height:32px;display:grid;place-items:center;border-radius:6px;flex:none}
.icon-btn.sm{width:26px;height:26px}
.icon-btn.sm svg{width:14px;height:14px}
.conn{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);padding:0 10px;white-space:nowrap;flex:none}
.conn i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.conn[data-state="live"] i{background:var(--up);box-shadow:0 0 0 3px var(--up-soft)}
.conn[data-state="live"] .conn-text{color:var(--fg)}
.conn[data-state="reconnecting"] i{background:var(--warn)}

/* 왼쪽 도구 */
.tools{grid-area:tools;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;border-right:1px solid var(--line)}
.tool{width:36px;height:36px;display:grid;place-items:center;border-radius:6px;flex:none}
.tool[aria-pressed="true"]{color:var(--accent);background:var(--accent-soft)}
.tool.txt{font-size:12px;font-weight:600;letter-spacing:.02em}
.hsep{width:22px;height:1px;background:var(--line);margin:4px 0;flex:none}

/* 차트 */
.chart-area{grid-area:chart;display:flex;flex-direction:column;min-width:0;min-height:0;overflow-y:auto;overflow-x:hidden}
.pane{position:relative;min-height:0}
.main-pane{flex:1 1 auto;min-height:240px}
.panes{display:flex;flex-direction:column;flex:none}
.sub-pane{flex:none;height:120px;border-top:1px solid var(--line)}
.pane-grip{position:absolute;left:0;right:0;top:-4px;height:8px;z-index:6;cursor:row-resize}
.pane-grip:hover,.pane-grip.drag{background:linear-gradient(to bottom,transparent 3px,var(--accent) 3px,var(--accent) 5px,transparent 5px)}
.chart{position:absolute;inset:0}
.legend{position:absolute;top:8px;left:10px;right:100px;z-index:3;pointer-events:none;display:flex;flex-direction:column;align-items:flex-start;gap:2px;font-size:12px}
.lg-title{display:flex;gap:6px;align-items:center;font-size:14px;font-weight:500;white-space:nowrap}
.lg-sep{color:var(--muted)}
.lg-vals{display:flex;flex-wrap:wrap;column-gap:10px;color:var(--muted)}
.legend b{font-weight:500;font-variant-numeric:tabular-nums}
.lg-toggle{pointer-events:auto;font-size:11px;color:var(--muted);height:20px;padding:0 6px;border-radius:4px;border:1px solid var(--line);margin-left:4px;font-weight:400}
.lg-toggle:hover{color:var(--fg);background:var(--raise)}
.lg-inds{display:flex;flex-direction:column;align-items:flex-start;gap:1px;align-self:stretch}
.lg-inds.collapsed{display:none}
.lg-row>*{white-space:nowrap}
.lg-row{display:inline-flex;align-items:center;flex-wrap:wrap;column-gap:8px;pointer-events:auto;padding:1px 4px;margin-left:-4px;border-radius:4px;max-width:100%;color:var(--muted)}
.lg-row:hover{background:color-mix(in srgb,var(--raise) 88%,transparent)}
.lg-name{color:var(--fg)}
.lg-row.off .lg-name,.lg-row.off b{opacity:.4}
.lg-row{position:relative}
.lg-act{display:inline-flex;gap:1px;opacity:0;pointer-events:none;position:absolute;left:100%;top:0;margin-left:2px;padding:0 2px;border-radius:4px;background:var(--raise);box-shadow:0 0 0 1px var(--line)}
.lg-row:hover .lg-act,.lg-row:focus-within .lg-act{opacity:1;pointer-events:auto}
.lg-row:hover::after{content:"";position:absolute;left:100%;top:0;bottom:0;width:4px}
.lg-act button{width:22px;height:20px;display:grid;place-items:center;border-radius:4px;color:var(--muted)}
.lg-act button:hover{background:var(--raise-2);color:var(--fg)}
.lg-act svg{width:14px;height:14px}
@media (hover:none){.lg-act{position:static;opacity:1;pointer-events:auto;background:none;box-shadow:none;margin:0}}
.pane-legend{top:5px}
.draw-hint{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:4;background:var(--accent);color:#fff;padding:6px 14px;border-radius:999px;font-size:12px;pointer-events:none;white-space:nowrap}
.to-rt{position:absolute;right:98px;bottom:38px;z-index:4;width:30px;height:30px;border-radius:6px;background:var(--raise);border:1px solid var(--line);display:grid;place-items:center;box-shadow:var(--shadow)}
.to-rt svg{width:16px;height:16px}
.overlay{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:color-mix(in srgb,var(--bg) 78%,transparent);color:var(--muted);text-align:center;padding:24px}
.overlay p{margin:0;max-width:44ch}
.spinner{width:28px;height:28px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.iv-quick{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);z-index:8;background:var(--raise);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:12px 14px;display:flex;flex-direction:column;gap:6px;width:250px}
.iv-quick label{font-size:12px;color:var(--muted)}
.iv-quick input{height:38px;font-size:18px;font-weight:600;border:1px solid var(--accent);border-radius:6px;background:var(--bg);padding:0 10px;outline:none}
.iv-quick .hint{font-size:11px;color:var(--muted)}
.iv-quick .hint.err{color:var(--down)}

/* 공통 입력 */
.field{height:32px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);padding:0 8px;min-width:0}
.field:focus{outline:none;border-color:var(--accent)}
.num-in{width:78px}
.btn-primary{height:32px;padding:0 14px;border-radius:6px;background:var(--accent);color:#fff;font-weight:600;white-space:nowrap}
.btn-ghost{height:32px;padding:0 14px;border-radius:6px;border:1px solid var(--line);white-space:nowrap}
.btn-ghost:hover{background:var(--raise)}
.overlay .btn-primary{margin-top:2px}

/* 오른쪽 패널 */
.side{grid-area:side;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.summary{padding:14px 14px 12px;border-bottom:1px solid var(--line);flex:none}
.sum-top{display:flex;gap:10px;align-items:center}
.sum-sym{font-size:15px;font-weight:600}
.sum-sym small,.w-sym small,.s-name small{color:var(--muted);font-weight:400;font-size:.88em}
.sum-sub{font-size:12px;color:var(--muted)}
.sum-price{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:10px}
#sumLast{font-size:26px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
.sum-chg{font-size:13px;font-weight:500;white-space:pre}
.sum-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin:12px 0 0}
.sum-grid div{min-width:0}
.sum-grid dt{font-size:11px;color:var(--muted)}
.sum-grid dd{margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec-head{display:flex;align-items:center;justify-content:space-between;padding:10px 10px 6px 14px}
.sec-head h2{font-size:13px;font-weight:600;margin:0}
.watch{flex:1 1 0;min-height:150px;display:flex;flex-direction:column;border-bottom:1px solid var(--line)}
.cols{display:grid;grid-template-columns:1.3fr 1fr .8fr;gap:8px;padding:0 14px 6px;font-size:11px;color:var(--muted)}
.cols span:not(:first-child){text-align:right}
.w-list{list-style:none;margin:0;padding:0;overflow-y:auto;flex:1 1 auto;min-height:0}
.w-item{position:relative}
.w-row{display:grid;grid-template-columns:1.3fr 1fr .8fr;gap:8px;width:100%;padding:6px 14px;text-align:left;align-items:center}
.w-row:hover{background:var(--raise)}
.w-item.active .w-row{background:var(--accent-soft)}
.w-sym{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w-last,.w-chg{text-align:right;white-space:nowrap;border-radius:3px}
.w-del{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:22px;height:22px;display:grid;place-items:center;border-radius:4px;background:var(--raise-2);opacity:0}
.w-del svg{width:12px;height:12px}
.w-item:hover .w-del,.w-del:focus-visible{opacity:1}
.flash-up{animation:flUp .7s ease-out}
.flash-down{animation:flDn .7s ease-out}
@keyframes flUp{from{background:var(--up-soft)}to{background:transparent}}
@keyframes flDn{from{background:var(--down-soft)}to{background:transparent}}
.tape{flex:1.25 1 0;min-height:240px;display:flex;flex-direction:column}
.tabs{display:flex;gap:4px;padding:8px 10px 6px}
.tabs button{height:28px;padding:0 12px;border-radius:6px;color:var(--muted);font-weight:500}
.tabs button[aria-selected="true"]{color:var(--fg);background:var(--raise)}
.tab-panel{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.t-cols{grid-template-columns:1fr 1fr .9fr}
.t-list,.ob-list{flex:1 1 auto;min-height:0;overflow:hidden;font-family:var(--mono);font-size:12px}
.t-row,.ob-row{display:grid;grid-template-columns:1fr 1fr .9fr;gap:8px;padding:0 14px;height:19px;align-items:center;position:relative;white-space:nowrap}
.t-row span:not(:first-child),.ob-row span:not(:first-child){text-align:right}
.ob-row i{position:absolute;top:1px;bottom:1px;right:0}
.ob-row.down i{background:var(--down-soft)}
.ob-row.up i{background:var(--up-soft)}
.ob-row span{position:relative}
.ob-row.down span:first-child{color:var(--down)}
.ob-row.up span:first-child{color:var(--up)}
.ob-mid{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:5px 14px;border-block:1px solid var(--line);margin:3px 0;font-family:var(--ui)}
.ob-mid strong{font-size:16px;font-weight:600}
.ob-mid span{font-size:11px}
.empty{padding:16px 14px;color:var(--muted);font-family:var(--ui);list-style:none}
/* 신호 비서 */
.sg-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 14px 6px;font-size:11px;color:var(--muted)}
.sg-sw{display:flex;align-items:center;gap:4px;cursor:pointer;color:var(--fg)}
.sg-body{flex:1 1 auto;min-height:0;overflow-y:auto;padding:0 10px 10px;font-size:12px}
.sg-note{font-size:11px;color:var(--muted);background:var(--raise);border-radius:6px;padding:6px 8px;margin:0 0 8px;line-height:1.45}
.sg-side{border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin-bottom:8px}
.sg-side.on{border-color:var(--accent);background:var(--accent-soft)}
.sg-side h3{margin:0 0 4px;font-size:12px;font-weight:600;display:flex;justify-content:space-between}
.sg-side h3.long{color:var(--up)}
.sg-side h3.short{color:var(--down)}
.sg-st{display:grid;grid-template-columns:16px 1fr;gap:2px 6px;margin:2px 0;line-height:1.4}
.sg-st b{font-weight:600}
.sg-st .ok{color:var(--up)}
.sg-st .no{color:var(--muted)}
.sg-st small{grid-column:2;color:var(--muted);font-size:11px;word-break:keep-all}
.sg-tbl{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11px;margin-bottom:8px}
.sg-tbl th{font-family:var(--ui);font-weight:500;color:var(--muted);text-align:right;padding:2px 3px}
.sg-tbl th:first-child,.sg-tbl td:first-child{text-align:left}
.sg-tbl td{text-align:right;padding:2px 3px;border-top:1px solid var(--line);white-space:nowrap}
.sg-tbl .u{color:var(--up)}
.sg-tbl .d{color:var(--down)}
.sg-tbl .m{color:var(--muted)}
.sg-sec{font-size:11px;color:var(--muted);margin:6px 0 4px}
.sg-log{list-style:none;margin:0;padding:0}
.sg-log li{padding:4px 0;border-top:1px solid var(--line);font-size:11px;line-height:1.4}
.sg-log li b.long{color:var(--up)}
.sg-log li b.short{color:var(--down)}
.sg-help{margin:0 0 8px;font-size:11px;line-height:1.5}
.sg-help summary{cursor:pointer;color:var(--accent);padding:2px 0}
.sg-help dl{margin:4px 0 0}
.sg-help dt{font-weight:600;margin-top:6px}
.sg-help dd{margin:2px 0 0;color:var(--muted)}
.sg-tbl td:last-child span{display:inline-block;margin:0 4px 2px 0;cursor:help}

/* 팝오버 */
.pop{position:fixed;z-index:30;min-width:230px;background:var(--raise);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:6px}
.pop-title{font-size:11px;color:var(--muted);padding:6px 10px 4px;letter-spacing:.02em}
.pop-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:6px;text-align:left;white-space:nowrap}
.pop-item:hover{background:var(--raise-2)}
.type-item[aria-checked="true"]{color:var(--accent);font-weight:600}
.type-item .check{margin-left:auto;opacity:0}
.type-item[aria-checked="true"] .check{opacity:1}
.iv-pop{width:330px;max-height:min(72vh,600px);overflow-y:auto;padding:8px}
.iv-group+.iv-group{margin-top:4px}
.iv-gtitle{font-size:11px;color:var(--muted);padding:4px 4px}
.iv-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.iv-cell{display:flex;align-items:center;border-radius:6px;background:var(--bg);border:1px solid var(--line);min-width:0}
.iv-cell.cur{border-color:var(--accent)}
.iv-cell.cur .iv-pick{color:var(--accent);font-weight:600}
.iv-pick{flex:1;min-width:0;height:30px;padding:0 8px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iv-star,.iv-rm{width:22px;height:30px;display:grid;place-items:center;color:var(--muted);flex:none}
.iv-star svg{width:13px;height:13px}
.iv-rm svg{width:10px;height:10px}
.iv-star[aria-pressed="true"]{color:var(--star)}
.iv-star:hover,.iv-rm:hover{color:var(--fg)}
.iv-add{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.iv-add .lbl{font-size:12px;font-weight:600;width:100%}
.iv-note{margin:6px 2px 2px;font-size:11px;color:var(--muted)}

/* 모달 */
.modal{position:fixed;inset:0;z-index:40;background:var(--backdrop);display:flex;align-items:flex-start;justify-content:center;padding:8vh 16px 16px}
.modal.top{z-index:45}
.modal-card{width:min(580px,100%);max-height:84vh;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 12px 10px 18px;flex:none}
.modal-head h2{margin:0;font-size:16px;font-weight:600}
.search-box{display:flex;align-items:center;gap:8px;margin:0 14px;padding:0 12px;height:40px;border:1px solid var(--line);border-radius:8px;color:var(--muted);flex:none}
.search-box:focus-within{border-color:var(--accent)}
.search-box svg{width:18px;height:18px;flex:none}
.search-box input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:15px;color:var(--fg)}
.search-box input.upper{text-transform:uppercase}
.search-box input::placeholder{text-transform:none;color:var(--muted)}
.qtabs{display:flex;gap:6px;padding:10px 14px;overflow-x:auto;scrollbar-width:none;flex:none}
.qtabs button{height:28px;padding:0 12px;border-radius:999px;border:1px solid var(--line);font-size:12px;white-space:nowrap}
.qtabs button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.s-list{list-style:none;margin:0;padding:0 6px 6px;overflow-y:auto;flex:1 1 auto;min-height:0}
.s-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:8px 10px;border-radius:6px;cursor:pointer}
.s-row.sel,.s-row:hover{background:var(--raise)}
.s-name{display:flex;flex-direction:column;min-width:0}
.s-name b{font-weight:600}
.s-sub{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-last{text-align:right}
.s-chg{text-align:right;min-width:64px}
.modal-foot{padding:8px 18px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);flex:none}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex:none}

/* 지표 창 */
.ind-card{width:min(800px,100%);height:min(700px,86vh);max-height:none}
.ma-quick{padding:0 18px 12px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line);flex:none}
.mq-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mq-title{font-weight:600;margin-right:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chips>span{font-size:12px;color:var(--muted);margin-right:2px}
.chip{height:26px;padding:0 10px;border-radius:999px;border:1px solid var(--line);font-size:12px}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.ind-card .search-box{margin:12px 14px}
.ind-body{flex:1;min-height:0;display:grid;grid-template-columns:172px minmax(0,1fr);border-top:1px solid var(--line)}
.ind-cats{display:flex;flex-direction:column;gap:2px;padding:8px;border-right:1px solid var(--line);overflow-y:auto}
.ind-cats button{display:flex;justify-content:space-between;gap:6px;text-align:left;padding:8px 10px;border-radius:6px;color:var(--muted);white-space:nowrap}
.ind-cats button:hover{background:var(--raise);color:var(--fg)}
.ind-cats button[aria-pressed="true"]{background:var(--raise);color:var(--fg);font-weight:600}
.ind-cats small{font-weight:400;color:var(--muted)}
.ind-list{list-style:none;margin:0;padding:6px;overflow-y:auto;min-height:0}
.ind-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:6px;text-align:left}
.ind-item:hover{background:var(--raise)}
.ind-name{font-weight:500;white-space:nowrap}
.ind-en{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.badge{margin-left:auto;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 6px;white-space:nowrap;flex:none}
.ind-cnt{font-size:11px;color:var(--accent);white-space:nowrap;flex:none;min-width:44px;text-align:right}
.ap-item.off .ind-name{opacity:.45}
.ap-swatch{width:10px;height:10px;border-radius:50%;flex:none}
.ap-btns{display:flex;gap:2px;flex:none}
.ap-btns button{width:28px;height:28px;display:grid;place-items:center;border-radius:6px;color:var(--muted)}
.ap-btns button:hover{background:var(--raise-2);color:var(--fg)}
.ap-btns svg{width:16px;height:16px}
.ap-foot{display:flex;justify-content:flex-end;gap:8px;padding:10px 4px;list-style:none}
.set-card{width:min(460px,100%)}
.set-form{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:4px 18px 16px;overflow-y:auto;min-height:0}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:12px;color:var(--muted)}
.fld.color{flex-direction:row;align-items:center;gap:8px}
.fld input[type=color]{width:36px;height:28px;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:2px;cursor:pointer;flex:none}
.fld-sep{grid-column:1/-1;font-size:12px;font-weight:600;padding-top:8px;border-top:1px solid var(--line)}

.toasts{position:fixed;right:16px;bottom:16px;z-index:60;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{max-width:min(380px,calc(100vw - 32px));padding:10px 14px;border-radius:8px;background:var(--raise);border:1px solid var(--line);box-shadow:var(--shadow);border-left:3px solid var(--accent);animation:tin .2s ease-out;transition:opacity .25s,transform .25s}
.toast.up{border-left-color:var(--up)}
.toast.down,.toast.err{border-left-color:var(--down)}
.toast.out{opacity:0;transform:translateY(6px)}
@keyframes tin{from{opacity:0;transform:translateY(6px)}}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:2.4s}.flash-up,.flash-down,.toast{animation:none}}

@media (max-width:900px){
  html,body{height:auto}
  body{overflow:auto}
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:48px auto auto auto;grid-template-areas:"top" "tools" "chart" "side"}
  /* 휴대폰: 메인 차트는 화면의 58%, 지표 창은 그 아래로 쌓고 페이지 전체가 스크롤 */
  .chart-area{overflow:visible}
  .main-pane{flex:none;height:58vh;min-height:300px}
  .tools{flex-direction:row;padding:4px 8px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  .hsep{width:1px;height:22px;margin:0 4px}
  .side{border-left:0;border-top:1px solid var(--line);overflow:visible}
  .watch{flex:none;min-height:0}
  .w-list{max-height:360px}
  .tape{flex:none;height:440px}
  .legend{right:92px}
}
@media (max-width:640px){
  .ind-body{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .ind-cats{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
  .set-form{grid-template-columns:1fr}
}
</style>
